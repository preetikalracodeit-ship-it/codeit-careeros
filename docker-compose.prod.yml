# Sprint 8 production stack: MySQL + Spring Boot API + Next.js frontend.
# Secrets are NEVER hardcoded here — every sensitive value comes from the
# environment files referenced below. Copy .env.example to the real files
# and fill them in on the deployment host (never commit the real ones).
#
#   cp .env.example backend.env
#   cp careeros-frontend/.env.example frontend.env   # only NEXT_PUBLIC_API_URL
#   docker compose -f docker-compose.prod.yml up -d --build

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    env_file:
      - ./backend.env
    environment:
      MYSQL_DATABASE: ${DB_NAME:-careeros}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./careeros-backend
    restart: unless-stopped
    env_file:
      - ./backend.env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://mysql:3306/${DB_NAME:-careeros}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&connectionTimeZone=UTC
    volumes:
      # Persisted upload store for CV files + profile photos when CV_STORAGE=local
      # (deploy-prod.sh default without a real S3 bucket). Survives rebuilds.
      - upload-data:/data
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./careeros-frontend
      args:
        # Server-side proxy target (inside the compose network). Browsers use
        # same-origin /api/*, so NEXT_PUBLIC_API_URL stays empty unless you
        # deliberately want browsers to call a backend directly (needs HTTPS
        # API + CORS then — not recommended).
        API_PROXY_URL: http://backend:8080
        NEXT_PUBLIC_API_URL: ${FRONTEND_API_URL:-}
        # Google Sign-In button (baked at build time). deploy-prod.sh exports
        # GOOGLE_CLIENT_ID from backend.env, so setting it there enables both
        # backend verification and the frontend button. Empty = button hidden.
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
        # Public owner-provided legal contact. Empty is surfaced honestly on
        # the legal pages; it is never replaced with an invented address.
        NEXT_PUBLIC_LEGAL_CONTACT_EMAIL: ${LEGAL_CONTACT_EMAIL:-}
        NEXT_PUBLIC_LEGAL_WEBSITE: ${LEGAL_WEBSITE:-}
        APP_VERSION: ${APP_VERSION:-unknown}
    restart: unless-stopped
    environment:
      # Runtime value for the public frontend /health endpoint. NEXT_PUBLIC_*
      # values are already inlined at build time and are not repeated here.
      APP_VERSION: ${APP_VERSION:-unknown}
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  mysql-data:
  upload-data:
