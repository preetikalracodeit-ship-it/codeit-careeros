name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend lint, build, dependency audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: careeros-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: careeros-frontend/package-lock.json

      - name: Install from lockfile
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build
        env:
          API_PROXY_URL: http://localhost:8080
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Dependency audit (fail on high/critical)
        run: npm audit --audit-level=high

  backend:
    name: Backend tests and package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: careeros-backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify (compile, tests, package)
        run: mvn -B verify
        env:
          MAVEN_OPTS: -Djava.awt.headless=true
          # Build identity exposed by /api/v1/meta/version. It identifies the
          # exact commit tested; it is not a secret.
          APP_BUILD_COMMIT: ${{ github.sha }}

  migration-mysql:
    name: MySQL migrations (fresh schema + Hibernate validate)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        # Disposable database for migration verification only. These are
        # ephemeral CI credentials, not deployment secrets.
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root-ci-only
          MYSQL_DATABASE: careeros_migration_test
          MYSQL_USER: careeros
          MYSQL_PASSWORD: careeros-ci-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot-ci-only"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    defaults:
      run:
        working-directory: careeros-backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Flyway V1–V3 on MySQL then Hibernate validate
        run: mvn -B -Dtest=MigrationMySqlIntegrationTest test
        env:
          MYSQL_TEST_URL: jdbc:mysql://127.0.0.1:3306/careeros_migration_test?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
          MYSQL_TEST_USER: careeros
          MYSQL_TEST_PASSWORD: careeros-ci-only
          MAVEN_OPTS: -Djava.awt.headless=true

  backend-sca:
    name: Backend dependency scan (fail on HIGH/CRITICAL)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    defaults:
      run:
        working-directory: careeros-backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: OWASP Dependency-Check (direct + transitive)
        # Threshold: CVSS >= 7.0 fails. Suppressions require review and an
        # expiry date (see dependency-check-suppressions.xml and
        # docs/DEPENDENCY_SECURITY.md).
        #
        # The key is exported only when the secret exists: passing an empty
        # NVD_API_KEY breaks the NVD client. Without a key the scan still
        # runs, just slower (NVD public rate limit).
        run: |
          if [ -n "$NVD_KEY" ]; then
            export NVD_API_KEY="$NVD_KEY"
            echo "NVD API key: configured"
          else
            echo "NVD API key: not configured (public rate limit applies)"
          fi
          mvn -B -Psca -DskipTests compile org.owasp:dependency-check-maven:check
        env:
          NVD_KEY: ${{ secrets.NVD_API_KEY }}
          MAVEN_OPTS: -Djava.awt.headless=true

      - name: Upload dependency findings to code scanning
        if: always() && hashFiles('careeros-backend/target/dependency-check-report.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: careeros-backend/target/dependency-check-report.sarif
          category: dependency-check

      - name: Record resolved dependency tree
        if: always()
        run: mvn -B dependency:tree -DoutputFile=target/dependency-tree.txt

      - name: Upload dependency reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-dependency-reports
          retention-days: 14
          path: |
            careeros-backend/target/dependency-tree.txt
            careeros-backend/target/dependency-check-report.html
            careeros-backend/target/dependency-check-report.json
