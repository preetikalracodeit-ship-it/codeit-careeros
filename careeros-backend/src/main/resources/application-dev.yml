spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/careeros?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&connectionTimeZone=UTC}
    username: ${DB_USERNAME:careeros}
    password: ${DB_PASSWORD:careeros_dev_pw}
