    secret: ${JWT_SECRET:dev-only-change-me-careeros-jwt-secret-2026}
  bootstrap:
    admin-email: ${ADMIN_EMAIL:admin@careeros.local}
    admin-password: ${ADMIN_PASSWORD:Adm1n@ChangeMe}
  cv:
    storage: ${CV_STORAGE:local}
    local-dir: ${CV_LOCAL_DIR:./data/cv-storage}
  profile-photo:
    local-dir: ${PROFILE_PHOTO_DIR:./data/profile-photos}

logging:
  level:
    org.hibernate.SQL: INFO