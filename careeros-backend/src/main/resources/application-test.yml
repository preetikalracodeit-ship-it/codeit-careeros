spring:
  datasource:
    url: jdbc:h2:mem:careerostest;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    # The ordinary unit/integration suite builds the schema with Hibernate on
    # an in-memory database. Migration correctness is covered separately by
    # MigrationScriptTest (H2) and MigrationMySqlIntegrationTest (CI MySQL).
    enabled: false

app:
  jwt:
    secret: test-only-careeros-jwt-secret-0123456789abcdef-used-in-tests
  ai:
    # Tests replace the ChatModel with a stub; this dummy key only flips the
    # "configured" check so the chat flow is exercised without any network.
    api-key: test-key-for-stubbed-chat-model
  bootstrap:
    admin-email: admin@test.local
    admin-password: Admin@123Test
  cv:
    storage: local
    local-dir: ${java.io.tmpdir}/careeros-cv-test